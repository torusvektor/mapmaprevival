<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>MapMap Web</title>
  <meta name="description" content="MapMap Web – free video mapping (projection mapping) in the browser. Port of the MapMap desktop application.">
  <meta name="theme-color" content="#1b1d26">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MapMap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" data-layout="both">
    <header id="toolbar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="26" height="26">
        <span>MapMap</span>
      </div>
      <nav id="menubar" class="hide-compact" aria-label="Menu">
        <button type="button" data-menu="file" data-i18n="menu.file">Soubor</button>
        <button type="button" data-menu="edit" data-i18n="menu.edit">Úpravy</button>
        <button type="button" data-menu="layer" data-i18n="menu.layers">Vrstvy</button>
        <button type="button" data-menu="view" data-i18n="menu.view">Zobrazení</button>
        <button type="button" data-menu="help" data-i18n="menu.help">Nápověda</button>
      </nav>
      <button type="button" id="btn-main-menu" class="tool show-compact" data-i18n-title="menu.main"></button>
      <div id="tools"></div>
      <div id="layout-seg" class="segmented" role="group">
        <button type="button" data-layout="both" class="hide-compact" data-i18n-title="action.layoutBoth"><span data-i18n="layout.both">Obojí</span></button>
        <button type="button" data-layout="input" data-i18n-title="action.layoutInput"><span data-i18n="layout.input">Vstup</span></button>
        <button type="button" data-layout="output" data-i18n-title="action.layoutOutput"><span data-i18n="layout.output">Výstup</span></button>
      </div>
    </header>

    <main id="workspace">
      <section id="views">
        <div id="view-input" class="view"></div>
        <div id="views-splitter" class="splitter horizontal" role="separator" aria-orientation="horizontal"></div>
        <div id="view-output" class="view"></div>
      </section>
      <div id="sidebar-splitter" class="splitter vertical" role="separator" aria-orientation="vertical"></div>
      <aside id="sidebar">
        <div class="sheet-handle"></div>
        <div class="tabs" role="tablist">
          <button type="button" data-tab="sources" role="tab"><span data-i18n="panel.sources">Zdroje</span></button>
          <button type="button" data-tab="layers" role="tab"><span data-i18n="panel.layers">Vrstvy</span></button>
        </div>
        <div id="panel-sources" class="panel" data-panel="sources">
          <div id="sources-toolbar" class="list-toolbar"></div>
          <ul id="sources-list" class="item-list"></ul>
          <div id="source-props" class="props"></div>
        </div>
        <div id="panel-layers" class="panel" data-panel="layers">
          <div id="layers-toolbar" class="list-toolbar"></div>
          <ul id="layers-list" class="item-list"></ul>
          <div id="layer-props" class="props"></div>
        </div>
      </aside>
    </main>

    <footer id="statusbar">
      <span id="st-layer"></span>
      <span id="st-source" class="hide-compact"></span>
      <span class="grow"></span>
      <span id="st-pos" class="hide-compact"></span>
      <span id="st-zoom"></span>
      <span id="st-output" title="Output"></span>
      <span id="st-fps" class="hide-compact"></span>
      <span id="st-save"></span>
    </footer>

    <nav id="mobile-nav">
      <button type="button" data-mtab="input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8v6H8z"/></svg><span data-i18n="layout.input">Vstup</span></button>
      <button type="button" data-mtab="output"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"/><path d="M8 20.5h8M12 16.5v4"/></svg><span data-i18n="layout.output">Výstup</span></button>
      <button type="button" data-mtab="sources"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-i18n="panel.sources">Zdroje</span></button>
      <button type="button" data-mtab="layers"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg><span data-i18n="panel.layers">Vrstvy</span></button>
    </nav>
  </div>

  <div id="presentation" class="presentation" hidden></div>
  <div id="drop-hint" hidden><div data-i18n="drop.hint">Pusťte soubory médií nebo projektu</div></div>

  <noscript><p style="padding:2em;color:#fff;background:#111">MapMap Web needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>

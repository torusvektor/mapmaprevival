# Build a Qt project on macOS
name: Build on macOS

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: macos-latest

    env:
      GST_VERSION: '1.26.0'

    steps:
    - uses: actions/checkout@v4
    # The prebuilt Qt 5.15.2 for macOS is x86_64 only: its tools run through Rosetta
    # on the Apple Silicon runners and the app is built for x86_64.
    - name: Install Rosetta
      run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        setup-python: false
    # src/src.pri expects the official GStreamer framework (universal x86_64 + arm64).
    # The package names are taken from the download directory listing.
    - name: Install GStreamer
      run: |
        set -euo pipefail
        base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
        pkgs=$(curl -fsSL --retry 3 "$base/" | grep -oE 'gstreamer-1\.0-(devel-)?[0-9.]+-universal\.pkg' | sort -u)
        echo "Packages: $pkgs"
        if [ -z "$pkgs" ]; then echo "No GStreamer packages found in $base/"; exit 1; fi
        for pkg in $pkgs; do
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pkg" "$base/$pkg"
          sudo installer -pkg "$RUNNER_TEMP/$pkg" -target /
        done
        ls /Library/Frameworks/GStreamer.framework/Versions/1.0/Headers/gst/gst.h
    # Qt 5.15.2 still links the AGL framework, which recent macOS SDKs no longer ship.
    - name: Remove AGL from Qt 5.15.2
      run: |
        QT_DIR="${QT_ROOT_DIR:-$Qt5_DIR}"
        grep -rl --include='*.conf' --include='*.pri' --include='*.prl' 'AGL' "$QT_DIR" | while read -r f; do
          sed -i '' -e 's/-framework AGL//g' -e 's#[^ ]*AGL\.framework/Headers/\{0,1\}##g' "$f"
        done
    - name: qmake
      run: |
        qmake --version
        qmake .
    - name: make
      run: make -j"$(sysctl -n hw.ncpu)"
    - name: make check
      run: make check

#    - name: make distcheck
#      run: make distcheck
